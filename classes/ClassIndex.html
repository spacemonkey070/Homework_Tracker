<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Tracker</title>
    <link rel="stylesheet" href="ClassStyle.css">
</head>
<body>

    <h1>Class Tracker</h1>

    <div id="view-switch">
        <button id="classes-view-btn">Classes</button>
        <button id="schedule-view-btn">Weekly Schedule</button>
    </div>


    <!-- Add Class Button -->
    <button id="add-class-btn">Add Class</button>

    <div id="form-overlay" class="hidden"></div>

    <div id="add-class-form" class="hidden">
        <h2>Add Class</h2>

        <label>Class Name:</label>
        <input id="class-name" type="text" placeholder="Algebra II">

        <label>Days of Week:</label>
        <div id="day-select">
            <label><input type="checkbox" class="day-checkbox" value="Monday"> Mon </label>
            <label><input type="checkbox" class="day-checkbox" value="Tuesday"> Tue </label>
            <label><input type="checkbox" class="day-checkbox" value="Wednesday"> Wed </label>
            <label><input type="checkbox" class="day-checkbox" value="Thursday"> Thu </label>
            <label><input type="checkbox" class="day-checkbox" value="Friday"> Fri </label>
            <label><input type="checkbox" class="day-checkbox" value="Saturday"> Sat </label>
    </div>

        <label>Time:</label>
        <input id="class-time" type="time">

        <label>Room:</label>
        <input id="class-room" type="text" placeholder="Room 204">

        <label>Color:</label>
        <input id="class-color" type="color" value="#4caf50">

        <button id="save-class-btn">Save Class</button>
        <button id="cancel-class-btn">Cancel</button>
    </div>

    <div id="delete-overlay" class="hidden">
        <div id="delete-popup">
            <h3>Delete Class?</h3>
            <p>Are you sure you want to delete this class?</p>
            <button id="confirm-delete-btn">Delete</button>
            <button id="cancel-delete-btn">Cancel</button>
        </div>
    </div>

    <div id="classes-view">
        <h2>Your Classes</h2>
        <div id="class-boxes"></div>
    </div>

    <div id="schedule-view" class="hidden">
        <h2>Weekly Schedule</h2>
        <div id="week-layout"></div>
    </div>

    <div id="hamburger">&#9776;</div>
    <div id="sidebar">
        <h2>Menu</h2>
            <button onclick="window.location.href='../index.html'">Homework List</button>
            <button onclick="window.location.href='ClassIndex.html'">Classes</button>
            <button onclick="window.location.href='../Calender/CalenderIndex.html'">Calendar</button>
    </div>


    <script src="ClassScript.js"></script>
</body>
</html>
