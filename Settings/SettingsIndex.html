<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="SettingsStyle.css">
</head>
<body>
    <h1>Settings</h1>
    <h2>Canvas Integration</h2>

    <div id="canvas-settings">
        <label>Canvas API Token:</label><br>
        <input type="text" id="canvas-api-token" style="width:300px;"><br>
    </div>
    <button id="sync-assignments-btn" style="margin-top:20px;">
        Sync Selected Courses
    </button>
    <section class="sync-section">
    <h3>Google Calendar</h3>
    <p class="sync-note">Adds your unfinished homework to a "HW Tracker" calendar.</p>
    <button id="syncBtn" class="sync-btn" type="button">Sync to Google Calendar</button>
</section>
</div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="gcal-sync.js"></script>
    <script src="SettingsScript.js"></script>
</body>
</html>
