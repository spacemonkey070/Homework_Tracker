<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homework Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hamburger">&#9776;</div>
    <div id="sidebar">
        <h2>Menu</h2>
        <button onclick="window.location.href='index.html'">Homework List</button>
        <button onclick="window.location.href='classes/ClassIndex.html'">Classes</button>
        <button onclick="window.location.href='Calender/CalenderIndex.html'">Calendar</button>
        <button onclick="window.location.href='Settings/SettingsIndex.html'">Settings</button>
    </div>

    <main class="page">
        <header class="top">
            <div>
                <h1>Homework</h1>
                <p id="subtitle">Nothing due this week</p>
            </div>

            <div id="progress-circle">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path id="circle-progress"
                        class="circle"
                        stroke-dasharray="0, 100"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
                <div id="circle-text">0 / 0</div>
                <div id="circle-label">this week</div>
            </div>
        </header>

        <button id="add-toggle" type="button" aria-expanded="false">+ Add</button>

        <form id="hw-form">
            <input type="text" id="name-input" placeholder="Homework name" required>
            <select id="class-input"></select>
            <input type="date" id="date-input" required>
            <input type="time" id="time-input" required>
            <button type="submit">Add homework</button>
        </form>

        <section class="dropdown" id="unfinished-section">
            <h2 id="unfinished-toggle">
                <span class="arrow">▼</span> Unfinished <span class="count" id="unfinished-count">0</span>
            </h2>
            <div id="unfinished-container"></div>
        </section>

        <section class="dropdown collapsed" id="finished-section">
            <h2 id="finished-toggle">
                <span class="arrow closed">▼</span> Finished <span class="count" id="finished-count">0</span>
            </h2>
            <div id="finished-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
