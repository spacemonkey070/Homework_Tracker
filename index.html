<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Homework Tracker</h1>

     <form id="hw-form">
        <select id="class-input" placeholder="Class"></select>
        <input type="text" id="name-input" placeholder="Homework Name" required>

        <!-- Date + Time -->
        <input type="date" id="date-input" placeholder="mm/dd/yyyy" required>
        <input type="time" id="time-input" placeholder="hh:mm" required>

        <!-- reminder -->
        <div id="reminder-boxes">
            <label><input type="checkbox" class="reminder-checkbox" value="60"> 1 hour </label>
            <label><input type="checkbox" class="reminder-checkbox" value="180"> 3 hours </label>
            <label><input type="checkbox" class="reminder-checkbox" value="1440"> 1 day </label>
            <label><input type="checkbox" class="reminder-checkbox" value="2880"> 2 days </label>
            <label><input type="checkbox" class="reminder-checkbox" value="4320"> 3 days </label>
        </div>

        <!-- Phone + carrier -->
        <input type="tel" id="phone-input" placeholder="Phone Number">
        <select id="carrier-input" placeholder="Carrier">
            <option value="vtext.com">Verizon</option>
            <option value="txt.att.net">AT&T</option>
            <option value="tmomail.net">T-Mobile</option>
            <option value="messaging.sprintpcs.com">Sprint</option>
            <option value="sms.myboostmobile.com">Boost</option>
            <option value="sms.cricketwireless.net">Cricket</option>
        </select>
        
        <input type="text" id="info-input" placeholder="Description">
        <button type="submit">Add Homework</button>
    </form>

    <div class="dropdown">
        <h2 id="unfinished-toggle">
            <span class="arrow">▼</span> Unfinished Homework 
        </h2>
        <div id="unfinished-container"></div>
    </div>

    <div class="dropdown">
        <h2 id="finished-toggle">
            <span class="arrow">▼</span> Finished Homework 
        </h2>
        <div id="finished-container"></div>
    </div>

    <div id="progress-circle">
        <svg viewBox="0 0 36 36" class="circular-chart">
            <path class="circle-bg"
                d="M18 2.0845
                a 15.9155 15.9155 0 0 1 0 31.831
                a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path id="circle-progress"
                class="circle"
                stroke-dasharray="0, 100"
                d="m18 2.0845
                    a 15.9155 15.9155 0 0 1 0 31.831
                    a 15.9155 15.9155 0 0 1 0 -31.831"/>
        </svg>

        <div id="circle-text">0 / 0</div>
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    
    <div id="hw-list"></div>

    <div id="hamburger">&#9776;</div>
    <div id="sidebar">
        <h2>Menu</h2>
        <button onclick="window.location.href='index.html'">Homework List</button>
        <button onclick="window.location.href='classes/ClassIndex.html'">Classes</button>
        <button onclick="window.location.href='Calender/CalenderIndex.html'">Calendar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
